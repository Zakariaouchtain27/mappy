<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mappy — Send a letter across the globe</title>
  <link rel="stylesheet" href="/vendor/maplibre-gl/maplibre-gl.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">

    <!-- ============ LOGIN: name + location ============ -->
    <section id="login-screen" class="screen active">
      <div class="card">
        <h1 class="logo">Mappy</h1>
        <p class="tagline">Drop a pin, write a letter, watch it travel.</p>

        <label class="field">
          <span>Your name</span>
          <input type="text" id="name" placeholder="e.g. User A" maxlength="40" />
        </label>

        <label class="field">
          <span>Where are you?</span>
          <input type="text" id="place" placeholder="Use my location, or click the map" maxlength="80" />
        </label>

        <div id="login-map" class="mini-map"></div>

        <div class="login-actions">
          <button type="button" id="locate-btn" class="btn ghost small">📍 Use my location</button>
          <span id="coords" class="coords muted"></span>
        </div>

        <button type="button" id="enter-btn" class="btn primary" disabled>Enter Mappy</button>
        <p id="login-hint" class="status">Click the map or use your location to set your pin.</p>
      </div>
    </section>

    <!-- ============ LOBBY: write & send a letter ============ -->
    <section id="lobby-screen" class="screen">
      <div class="card">
        <h2 id="lobby-greeting" class="lobby-title">Write a letter</h2>
        <p class="muted">Your letter flies to someone else online right now. If they like it, you chat.</p>

        <textarea id="letter-text" class="letter-input" rows="5"
                  maxlength="2000" placeholder="Dear stranger,&#10;&#10;…"></textarea>

        <button type="button" id="send-letter-btn" class="btn primary">✉️ Send Letter</button>
        <p id="lobby-status" class="status"></p>
      </div>
    </section>

    <!-- ============ STAGE: the map fly-across animation ============ -->
    <section id="stage-screen" class="screen">
      <div id="stage-map" class="full-map"></div>

      <div id="stage-banner" class="stage-banner"></div>

      <!-- Sender waiting overlay -->
      <div id="waiting-panel" class="overlay-panel hidden">
        <p id="waiting-text">Delivered. Waiting for them to open your letter…</p>
        <button type="button" id="cancel-letter-btn" class="btn ghost small">Cancel</button>
      </div>

      <!-- Recipient letter overlay (shown after the arc animation) -->
      <div id="letter-panel" class="overlay-panel letter-card hidden">
        <div class="letter-from">
          <span class="stamp">✉️</span>
          <div>
            <strong id="letter-sender">Someone</strong>
            <span id="letter-origin" class="muted"></span>
          </div>
        </div>
        <p id="letter-body" class="letter-body"></p>
        <div class="letter-actions">
          <button type="button" id="pass-btn" class="btn ghost">Pass</button>
          <button type="button" id="accept-btn" class="btn primary">Accept & Chat</button>
        </div>
      </div>
    </section>

    <!-- ============ CHAT ============ -->
    <section id="chat-screen" class="screen">
      <header class="chat-header">
        <div>
          <h2 id="partner-name">Match</h2>
          <p id="partner-meta" class="muted"></p>
        </div>
        <button id="leave-btn" class="btn ghost small">Leave</button>
      </header>

      <div id="messages" class="messages"></div>

      <form id="chat-form" class="chat-form">
        <input type="text" id="chat-input" placeholder="Type a message…" maxlength="2000" autocomplete="off" />
        <button type="submit" class="btn primary">Send</button>
      </form>
    </section>

  </div>

  <script src="/vendor/maplibre-gl/maplibre-gl.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
